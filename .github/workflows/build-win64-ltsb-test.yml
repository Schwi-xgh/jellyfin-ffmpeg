name: Build FFmpeg 8.1.3 - LTSB compatibility test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          update: true
          msystem: CLANG64
          install: >-
            git
            curl
            wget
            zip
            mingw-w64-clang-x86_64-toolchain
            quilt
            diffstat
            mingw-w64-clang-x86_64-nasm

      - name: Download official v8.1.3-1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jellyfin/jellyfin-ffmpeg
          ref: v8.1.3-1
          persist-credentials: false

      - name: Patch SVT-AV1 4.2.0 for Windows LTSB 2016
        run: |
          set -euo pipefail
          pkgdir="msys2/PKGBUILD/40-mingw-w64-svt-av1"
          pkg="$pkgdir/PKGBUILD"

          grep -q '^pkgver=4.2.0$' "$pkg"

          cat > "$pkgdir/ltsb-thread-name.patch" <<'PATCH'
          --- a/Source/Lib/Codec/svt_threads.c
          +++ b/Source/Lib/Codec/svt_threads.c
          @@ -211,3 +211,14 @@
                   if (MultiByteToWideChar(CP_UTF8, 0, truncated, -1, wname, (int)(sizeof(wname) / sizeof(wname[0]))) > 0) {
          -            (void)SetThreadDescription((HANDLE)thread_handle, wname);
          +            typedef HRESULT(WINAPI * SvtSetThreadDescriptionFn)(HANDLE, PCWSTR);
          +            HMODULE module = GetModuleHandleW(L"KernelBase.dll");
          +            SvtSetThreadDescriptionFn set_description = NULL;
          +            if (module)
          +                set_description = (SvtSetThreadDescriptionFn)GetProcAddress(module, "SetThreadDescription");
          +            if (!set_description) {
          +                module = GetModuleHandleW(L"Kernel32.dll");
          +                if (module)
          +                    set_description = (SvtSetThreadDescriptionFn)GetProcAddress(module, "SetThreadDescription");
          +            }
          +            if (set_description)
          +                (void)set_description((HANDLE)thread_handle, wname);
                   }
          PATCH

          # Apply the patch after makepkg extracts the SVT-AV1 source.
          # This prepare() replaces the original prepare() function.
          cat >> "$pkg" <<'PREPARE'

          prepare() {
            cd "${srcdir}/${_realname}-v${pkgver}"
            patch --batch --fuzz=0 -p1 -i "${startdir}/ltsb-thread-name.patch"
          }
          PREPARE

          git diff -- "$pkg"
          cat "$pkgdir/ltsb-thread-name.patch"
          
      - name: Fix missing exception header in zimg
        run: |
          set -euo pipefail
          pkg="msys2/PKGBUILD/40-mingw-w64-zimg/PKGBUILD"

          grep -q '^[[:space:]]*\./autogen\.sh' "$pkg"

          sed -i '/^[[:space:]]*\.\/autogen\.sh/i\  sed -i "1i#include <exception>" src/zimg/api/zimg.cpp' "$pkg"

          git diff -- "$pkg"
          
      - name: Prepare build directory
        run: mkdir -p /clang64/ffbuild

      - name: Build FFmpeg and FFprobe
        run: ./msys2/build.sh

      - name: Test executables on build machine
        run: |
          set -euo pipefail
          ./msys2/ffmpeg.exe -version
          ./msys2/ffprobe.exe -version

      - name: Upload compiled files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ffmpeg-8.1.3-win64-svt4.2.0-ltsb-fix
          path: ./msys2/artifacts/*.zip
          if-no-files-found: error
